name: Groq LLM Proxy
on:
  repository_dispatch:
    types: [run-llm]
jobs:
  run-groq-prompt:
    runs-on: ubuntu-latest
    steps:
      - name: Send Prompt to Groq
        id: groq_call
        run: |
          RESPONSE=$(curl -s -X POST "https://groq.com" \
            -H "Authorization: Bearer ${{ secrets.GROQ_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "llama3-3.3-70b-versatile",
              "messages": [{"role": "user", "content": "${{ github.event.client_payload.prompt }}"}]
            }')
          
          # Extract the content text from the JSON response
          MESSAGE=$(echo "$RESPONSE" | jq -r '.choices[0].message.content' | jq -sR @uri)
          echo "response=$MESSAGE" >> $GITHUB_OUTPUT

      - name: Trigger Response Back (Push to Repo)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Send the response back to a file or trigger another event
          echo "${{ steps.groq_call.outputs.response }}" > response.txt
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add response.txt
          git commit -m "Update Groq API Response"
          git push origin main
